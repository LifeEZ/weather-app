<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f4f8;
    }

    .weather-card {
      background: linear-gradient(135deg, #4a90d9, #1a5fa8);
      color: white;
      border-radius: 16px;
    }

    .weather-card .label {
      font-size: 0.8rem;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .weather-card .value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .temp-display {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
    }
  </style>
</head>

<body>
  <div class="container py-5" style="max-width: 860px;">
    <h1 class="mb-1 fw-bold">Weather App</h1>
    <p class="text-muted mb-4">Enter a city name to get the current weather.</p>

    <!-- Search -->
    <div class="input-group mb-4 shadow-sm">
      <input id="cityInput" type="text" class="form-control form-control-lg"
        placeholder="e.g. London, Tokyo, New York" />
      <button class="btn btn-primary px-4" id="searchBtn">Search</button>
    </div>

    <!-- Error -->
    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <!-- Weather result card -->
    <div id="weatherCard" class="weather-card p-4 mb-5 shadow d-none">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <div class="d-flex align-items-center gap-2 mb-0">
            <h2 class="mb-0 fw-bold" id="cardCity"></h2>
            <span id="cacheBadge" class="badge bg-warning text-dark d-none">Served from cache</span>
          </div>
          <p class="mb-3 text-white-50" id="cardDescription"></p>
          <div class="temp-display mb-3" id="cardTemp"></div>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-4">
          <div class="label">Feels like</div>
          <div class="value" id="cardFeelsLike"></div>
        </div>
        <div class="col-4">
          <div class="label">Humidity</div>
          <div class="value" id="cardHumidity"></div>
        </div>
        <div class="col-4">
          <div class="label">Wind speed</div>
          <div class="value" id="cardWind"></div>
        </div>
      </div>
    </div>

    <!-- History -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0 fw-semibold">Query History</h4>
    </div>

    <!-- Filters -->
    <div class="card shadow-sm mb-3">
      <div class="card-body py-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label small text-muted mb-1">City</label>
            <input id="filterCity" type="text" class="form-control" placeholder="Filter by city" />
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted mb-1">From</label>
            <input id="filterFrom" type="date" class="form-control" />
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted mb-1">To</label>
            <input id="filterTo" type="date" class="form-control" />
          </div>
          <div class="col-md-2 d-flex gap-2">
            <button class="btn btn-primary w-100" id="filterBtn">Filter</button>
            <button class="btn btn-outline-secondary w-100" id="clearBtn">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <div id="historyEmpty" class="text-muted fst-italic mb-3 d-none">No queries found.</div>
    <div class="table-responsive shadow-sm rounded">
      <table class="table table-hover bg-white mb-0" id="historyTable">
        <thead class="table-light">
          <tr>
            <th>City</th>
            <th>Temp (°C)</th>
            <th>Description</th>
            <th>Humidity</th>
            <th>Wind (m/s)</th>
            <th>Queried at</th>
            <th>Source</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div id="paginationWrapper" class="d-flex justify-content-between align-items-center mt-3 d-none">
      <small id="paginationInfo" class="text-muted"></small>
      <nav>
        <ul class="pagination pagination-sm mb-0" id="paginationControls"></ul>
      </nav>
    </div>
  </div>

  <script>
    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");
    const errorAlert = document.getElementById("errorAlert");
    const weatherCard = document.getElementById("weatherCard");
    const historyBody = document.getElementById("historyBody");
    const historyEmpty = document.getElementById("historyEmpty");
    const historyTable = document.getElementById("historyTable");
    const paginationWrapper = document.getElementById("paginationWrapper");
    const paginationInfo = document.getElementById("paginationInfo");
    const paginationControls = document.getElementById("paginationControls");
    const filterCity = document.getElementById("filterCity");
    const filterFrom = document.getElementById("filterFrom");
    const filterTo = document.getElementById("filterTo");

    let currentPage = 1;
    const PAGE_SIZE = 10;

    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.classList.remove("d-none");
    }

    function hideError() {
      errorAlert.classList.add("d-none");
    }

    function formatDate(isoString) {
      return new Date(isoString).toLocaleString();
    }

    function renderWeatherCard(data) {
      document.getElementById("cardCity").textContent = data.city;
      document.getElementById("cardDescription").textContent =
        data.description.charAt(0).toUpperCase() + data.description.slice(1);
      document.getElementById("cardTemp").textContent = `${data.temperature.toFixed(1)} °C`;
      document.getElementById("cardFeelsLike").textContent = `${data.feels_like.toFixed(1)} °C`;
      document.getElementById("cardHumidity").textContent = `${data.humidity}%`;
      document.getElementById("cardWind").textContent = `${data.wind_speed} m/s`;
      const cacheBadge = document.getElementById("cacheBadge");
      data.from_cache
        ? cacheBadge.classList.remove("d-none")
        : cacheBadge.classList.add("d-none");
      weatherCard.classList.remove("d-none");
    }

    function renderPagination(total, page, pages) {
      paginationControls.innerHTML = "";

      if (pages <= 1) {
        paginationWrapper.classList.add("d-none");
        return;
      }

      paginationWrapper.classList.remove("d-none");
      paginationInfo.textContent = `${total} result${total !== 1 ? "s" : ""}, page ${page} of ${pages}`;

      const prevLi = document.createElement("li");
      prevLi.className = `page-item ${page === 1 ? "disabled" : ""}`;
      prevLi.innerHTML = `<a class="page-link" href="#">&laquo;</a>`;
      prevLi.addEventListener("click", (e) => {
        e.preventDefault();
        if (page > 1) loadHistory(page - 1);
      });
      paginationControls.appendChild(prevLi);

      const maxVisible = 5;
      let start = Math.max(1, page - Math.floor(maxVisible / 2));
      let end = Math.min(pages, start + maxVisible - 1);
      if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

      for (let i = start; i <= end; i++) {
        const li = document.createElement("li");
        li.className = `page-item ${i === page ? "active" : ""}`;
        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
        const pageNum = i;
        li.addEventListener("click", (e) => {
          e.preventDefault();
          loadHistory(pageNum);
        });
        paginationControls.appendChild(li);
      }

      const nextLi = document.createElement("li");
      nextLi.className = `page-item ${page === pages ? "disabled" : ""}`;
      nextLi.innerHTML = `<a class="page-link" href="#">&raquo;</a>`;
      nextLi.addEventListener("click", (e) => {
        e.preventDefault();
        if (page < pages) loadHistory(page + 1);
      });
      paginationControls.appendChild(nextLi);
    }

    function renderHistory(data) {
      historyBody.innerHTML = "";

      if (data.items.length === 0) {
        historyEmpty.classList.remove("d-none");
        historyTable.classList.add("d-none");
        paginationWrapper.classList.add("d-none");
        return;
      }

      historyEmpty.classList.add("d-none");
      historyTable.classList.remove("d-none");

      data.items.forEach((entry) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="fw-semibold">${entry.city}</td>
          <td>${entry.temperature.toFixed(1)}</td>
          <td>${entry.description}</td>
          <td>${entry.humidity}%</td>
          <td>${entry.wind_speed}</td>
          <td>${formatDate(entry.queried_at)}</td>
          <td>${entry.from_cache ? '<span class="badge bg-warning text-dark">Cached</span>' : '<span class="badge bg-success">Live</span>'}</td>
          <td>
            <button class="btn btn-sm btn-outline-danger" data-id="${entry.id}">Delete</button>
          </td>
        `;
        tr.querySelector("button").addEventListener("click", () =>
          deleteEntry(entry.id)
        );
        historyBody.appendChild(tr);
      });

      renderPagination(data.total, data.page, data.pages);
    }

    async function loadHistory(page = 1) {
      currentPage = page;
      const params = new URLSearchParams({
        page,
        page_size: PAGE_SIZE,
      });

      const city = filterCity.value.trim();
      const from = filterFrom.value;
      const to = filterTo.value;

      if (city) params.set("city", city);
      if (from) params.set("date_from", from);
      if (to) params.set("date_to", to + "T23:59:59");

      const res = await fetch(`/api/history?${params}`);
      const data = await res.json();
      renderHistory(data);
    }

    async function searchWeather() {
      const city = cityInput.value.trim();
      if (!city) return;

      hideError();
      searchBtn.disabled = true;
      searchBtn.textContent = "Loading…";

      try {
        const res = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);
        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || "Something went wrong.");
          weatherCard.classList.add("d-none");
        } else {
          renderWeatherCard(data);
          await loadHistory(1);
        }
      } catch {
        showError("Could not reach the server.");
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = "Search";
      }
    }

    async function deleteEntry(id) {
      await fetch(`/api/history/${id}`, { method: "DELETE" });
      await loadHistory(currentPage);
    }

    searchBtn.addEventListener("click", searchWeather);
    cityInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchWeather();
    });
    document.getElementById("filterBtn").addEventListener("click", () => loadHistory(1));
    document.getElementById("clearBtn").addEventListener("click", () => {
      filterCity.value = "";
      filterFrom.value = "";
      filterTo.value = "";
      loadHistory(1);
    });

    loadHistory(1);
  </script>
</body>

</html>
